# 构建应用（双端）+ 部署文档站
#
# 触发条件：手动触发（workflow_dispatch）
# 流程：
#   1. macOS + Windows 并行构建并上传 OSS
#   2. 构建并部署文档站到 OSS
#
# 需要配置的 GitHub Secrets：
#   OSS_ACCESS_KEY_ID         app 用的 OSS AccessKey
#   OSS_ACCESS_KEY_SECRET     app 用的 OSS AccessKeySecret
#   OSS_DOCS_ACCESS_KEY_ID    文档站用的 OSS AccessKey（可与 app 不同）
#   OSS_DOCS_ACCESS_KEY_SECRET 文档站用的 OSS AccessKeySecret
#   APP_REPO_TOKEN            访问 app 私有仓库的 Personal Access Token（需 repo 权限）
#
# 需要配置的 GitHub Variables：
#   OSS_REGION               如 oss-cn-hangzhou
#   OSS_ENDPOINT             如 oss-cn-hangzhou.aliyuncs.com
#   OSS_BUCKET               app 用的 Bucket 名称
#   OSS_PREFIX               app 上传路径前缀（如 releases/qixiang-studio）
#   OSS_DOCS_REGION          文档站用的 Region（如 oss-cn-hangzhou）
#   OSS_DOCS_ENDPOINT        文档站用的 Endpoint
#   OSS_DOCS_BUCKET          文档站用的 Bucket 名称

name: Release App & Docs

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 构建并上传 macOS 安装包 ───────────────────────────────────────
  release-mac:
    name: Release macOS
    runs-on: macos-latest

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          repository: lepen-yang/qixiang-studio
          token: ${{ secrets.APP_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove package-lock.json
        run: rm -f package-lock.json

      - name: Install dependencies
        run: npm install
        env:
          npm_config_registry: https://registry.npmjs.org

      - name: Build & Upload
        run: npm run release release
        env:
          OSS_REGION: ${{ vars.OSS_REGION }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_PREFIX: ${{ vars.OSS_PREFIX }}

  # ─── 构建并上传 Windows 安装包 ─────────────────────────────────────
  release-win:
    name: Release Windows
    runs-on: windows-latest

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          repository: lepen-yang/qixiang-studio
          token: ${{ secrets.APP_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove package-lock.json
        run: rm -f package-lock.json

      - name: Install dependencies
        run: npm install
        env:
          npm_config_registry: https://registry.npmjs.org

      - name: Build & Upload
        run: npm run release release
        env:
          OSS_REGION: ${{ vars.OSS_REGION }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_PREFIX: ${{ vars.OSS_PREFIX }}

  # ─── 构建并部署文档站 ─────────────────────────────────────────────
  deploy-docs:
    name: Deploy Docs
    needs: [release-mac, release-win]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & Deploy Docs
        run: node scripts/build.mjs
        env:
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          OSS_REGION: ${{ vars.OSS_DOCS_REGION }}
          OSS_ENDPOINT: ${{ vars.OSS_DOCS_ENDPOINT }}
          OSS_BUCKET: ${{ vars.OSS_DOCS_BUCKET }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_DOCS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_DOCS_ACCESS_KEY_SECRET }}
